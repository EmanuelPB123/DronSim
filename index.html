<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Enjambre controlado con cantidad variable de drones</title>
  <style>
    body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      overflow: auto;
      max-height: 95vh;
    }
    button, select, input[type=number], input[type=range] {
      margin: 5px 0;
      padding: 5px 10px;
      background: #444;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    button:hover, select:hover {
      background: #666;
    }
    label {
      font-size: 12px;
      display: block;
      margin-top: 8px;
    }
    #instructions {
      font-size: 12px;
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label for="cantidadDrones">Cantidad de drones: <span id="cantidadValor">25</span></label>
    <input type="range" id="cantidadDrones" min="1" max="100" value="25">
    <input type="number" id="cantidadDronesInput" min="1" max="100" value="25" />
    
    <select id="formacion">
      <option value="cuadricula">🧱 Cuadrícula</option>
      <option value="circulo">🔵 Círculo</option>
      <option value="piramide">🔺 Pirámide</option>
    </select>
    <button onclick="crearFormacion()">📦 Crear Formación</button>
    <button onclick="ordenDespegar()">🚀 Despegar</button>
    <button onclick="toggleAvanzar()">➡️ Avanzar / Parar</button>
    <button onclick="toggleRotar()">🔄 Rotar / Parar</button>
    <button onclick="cambiarFormacion()">🔁 Cambiar Formación</button>
    <button onclick="toggleSeguirRuta()">🛣️ Seguir Ruta / Parar</button>
    <label>Velocidad avance: <input id="velAvance" type="range" min="0" max="1" step="0.01" value="0.2"></label>
    <label>Velocidad rotación: <input id="velRotacion" type="range" min="0" max="0.1" step="0.005" value="0.02"></label>
    <label>Inercia drones: <input id="inerciaDrones" type="range" min="0.01" max="0.2" step="0.01" value="0.05"></label>
    <p>Altitud objetivo: <span id="altitudValor">10</span></p>
    <p>Drones actuales: <span id="count">0</span></p>
    <div id="instructions">
      <p><b>Controles teclado:</b></p>
      <p>W/S: Avanzar/Retroceder</p>
      <p>A/D: Izquierda/Derecha (strafe)</p>
      <p>Q/E: Rotar izquierda/derecha</p>
      <p>Z/X: Subir/Bajar altitud</p>
    </div>
    <hr style="border-color: #444; margin: 10px 0;">
    <label for="cantidadGrupos">Cantidad de grupos: <span id="gruposValor">2</span></label>
    <input type="range" id="cantidadGrupos" min="2" max="10" value="2">
    <button onclick="separarGrupos()">🔀 Separar en Grupos</button>
    <button onclick="reagrupar()">🔄 Reagrupar</button>
    
    <hr style="border-color: #444; margin: 10px 0;">
    <label for="tiempoInactividad">Tiempo de inactividad (segundos): <span id="tiempoInactividadValor">5</span></label>
    <select id="tiempoInactividad">
      <option value="5">5 segundos</option>
      <option value="15">15 segundos</option>
      <option value="30">30 segundos</option>
      <option value="60">1 minuto</option>
      <option value="120">2 minutos</option>
    </select>
    <p id="estadoPausa" style="color: #ff4444; display: none;">⏸️ Simulación en pausa por inactividad</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 50);
    camera.lookAt(0, 10, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 50, 20);
    scene.add(light);

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide })
    );
    plane.rotation.x = -Math.PI/2;
    scene.add(plane);

    let drones = [];
    let totalDrones = 25;
    let estado = "en_suelo"; // en_suelo, despegando, esperando, moviendo
    let isPaused = false; // Add this at the top with other state variables

    const grupo = new THREE.Group();
    scene.add(grupo);

    const waypoints = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(20, 0, -20),
      new THREE.Vector3(-20, 0, -40),
      new THREE.Vector3(-30, 0, 20),
      new THREE.Vector3(0, 0, 0)
    ];
    let seguirRuta = false;
    let rutaIndice = 0;

    const keys = { w:false, a:false, s:false, d:false, q:false, e:false, z:false, x:false };

    // Altitud objetivo para la formación
    let altitudObjetivo = 10;

    let gruposActivos = false;
    let gruposFormaciones = [];

    function generarFormacion(tipo) {
      const separacion = 4;
      const posiciones = [];

      for(let i=0; i<totalDrones; i++){
        let x=0,y=0,z=0;
        if(tipo === "cuadricula"){
          const cols = Math.ceil(Math.sqrt(totalDrones));
          const row = Math.floor(i / cols);
          const col = i % cols;
          x = (col - (cols-1)/2)*separacion;
          z = (row - (cols-1)/2)*separacion;
        } else if(tipo === "circulo"){
          const radius=10;
          const angle = (i/totalDrones)*Math.PI*2;
          x = Math.cos(angle)*radius;
          z = Math.sin(angle)*radius;
        } else if(tipo === "piramide"){
          const layer = Math.floor(Math.sqrt(i));
          const colsLayer = layer+1;
          const col = i % colsLayer;
          const row = Math.floor(i / colsLayer) - layer;
          x = (col - (colsLayer-1)/2)*separacion;
          z = row*separacion;
          y = layer*2;
        }
        posiciones.push(new THREE.Vector3(x,y,z));
      }

      return posiciones;
    }

    function crearFormacion(){
      const tipo = document.getElementById("formacion").value;
      drones.forEach(d => grupo.remove(d.mesh));
      drones = [];
      grupo.rotation.set(0,0,0);
      grupo.position.set(0,0,0);
      rutaIndice = 0;
      seguirRuta = false;
      avanzar = false;
      rotar = false;
      estado = "en_suelo";
      altitudObjetivo = 10;
      document.getElementById("altitudValor").textContent = altitudObjetivo;

      const formacion = generarFormacion(tipo);
      for(let i=0; i<totalDrones; i++){
        // Crear geometría más realista para dron
        const droneGroup = new THREE.Group();
        
        // Cuerpo principal
        const cuerpo = new THREE.Mesh(
          new THREE.BoxGeometry(1, 0.3, 1),
          new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        droneGroup.add(cuerpo);
        
        // Luces LED
        const luzDelantera = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 })
        );
        luzDelantera.position.set(0, 0.2, 0.4);
        droneGroup.add(luzDelantera);
        
        const luzTrasera = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 })
        );
        luzTrasera.position.set(0, 0.2, -0.4);
        droneGroup.add(luzTrasera);

        // Rotores (4 hélices)
        for(let j = 0; j < 4; j++){
          const angulo = (j / 4) * Math.PI * 2;
          const x = Math.cos(angulo) * 0.4;
          const z = Math.sin(angulo) * 0.4;
          
          const rotor = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 0.02, 8),
            new THREE.MeshStandardMaterial({ color: 0x666666, transparent: true, opacity: 0.3 })
          );
          rotor.position.set(x, 0.25, z);
          droneGroup.add(rotor);
        }

        droneGroup.position.set(formacion[i].x, 1, formacion[i].z);
        grupo.add(droneGroup);
        
        drones.push({
          mesh: droneGroup,
          target: new THREE.Vector3(formacion[i].x, altitudObjetivo, formacion[i].z),
          velocity: new THREE.Vector3(0, 0, 0),
          acceleration: new THREE.Vector3(0, 0, 0),
          maxSpeed: 8 + Math.random() * 2, // Velocidad máxima variable
          maxAcceleration: 15 + Math.random() * 5, // Aceleración máxima variable
          dampening: 0.85 + Math.random() * 0.1, // Factor de amortiguación variable
          hover: {
            amplitude: 0.1 + Math.random() * 0.05,
            frequency: 1 + Math.random() * 0.5,
            offset: Math.random() * Math.PI * 2
          }
        });
      }
      document.getElementById("count").textContent = drones.length;
    }

    function ordenDespegar(){
      if(estado === "en_suelo") {
        estado = "despegando";
        // Agregar pequeños retrasos aleatorios para el despegue
        drones.forEach((drone, i) => {
          setTimeout(() => {
            drone.despegando = true;
          }, i * 50 + Math.random() * 200);
        });
      }
    }

    let avanzar = false;
    function toggleAvanzar(){
      if(estado === "esperando" || estado === "moviendo"){
        avanzar = !avanzar;
        if(avanzar) estado = "moviendo";
        else if(!rotar && !seguirRuta) estado = "esperando";
      }
    }

    let rotar = false;
    function toggleRotar(){
      if(estado === "esperando" || estado === "moviendo"){
        rotar = !rotar;
        if(rotar) estado = "moviendo";
        else if(!avanzar && !seguirRuta) estado = "esperando";
      }
    }

    function separarGrupos() {
      if(estado !== "esperando" && estado !== "moviendo") return;
      
      const cantidadGrupos = parseInt(document.getElementById("cantidadGrupos").value);
      const dronesPerGroup = Math.floor(drones.length / cantidadGrupos);
      
      gruposFormaciones = [];
      
      // Calcular posiciones para cada grupo
      for(let g = 0; g < cantidadGrupos; g++) {
        const angulo = (g / cantidadGrupos) * Math.PI * 2;
        const radio = 20; // Distancia de separación entre grupos
        const centroGrupo = new THREE.Vector3(
          Math.cos(angulo) * radio,
          0,
          Math.sin(angulo) * radio
        );
        
        // Calcular formación local para este grupo
        const formacionLocal = [];
        const inicio = g * dronesPerGroup;
        const fin = g === cantidadGrupos - 1 ? drones.length : (g + 1) * dronesPerGroup;
        
        for(let i = inicio; i < fin; i++) {
          const posLocal = new THREE.Vector3(
            (i - inicio) % 3 * 2 - 2, // Formación de 3x3 local
            0,
            Math.floor((i - inicio) / 3) * 2 - 2
          );
          formacionLocal.push(posLocal.add(centroGrupo));
        }
        
        gruposFormaciones.push(formacionLocal);
      }
      
      // Asignar nuevos targets a los drones
      let droneIndex = 0;
      gruposFormaciones.forEach(formacion => {
        formacion.forEach(pos => {
          if(droneIndex < drones.length) {
            drones[droneIndex].target.copy(pos);
            drones[droneIndex].target.y = altitudObjetivo;
            droneIndex++;
          }
        });
      });
      
      gruposActivos = true;
    }

    function reagrupar() {
      if(!gruposActivos) return;
      
      const tipo = document.getElementById("formacion").value;
      const formacionOriginal = generarFormacion(tipo);
      
      for(let i = 0; i < drones.length; i++) {
        drones[i].target.copy(formacionOriginal[i]);
        drones[i].target.y = altitudObjetivo;
      }
      
      gruposActivos = false;
    }

    function cambiarFormacion(){
      if(gruposActivos) {
        separarGrupos(); // Mantener la separación en grupos si está activa
      } else {
        const tipo = document.getElementById("formacion").value;
        const nueva = generarFormacion(tipo);
        for(let i=0; i<drones.length; i++){
          drones[i].target.set(nueva[i].x, altitudObjetivo, nueva[i].z);
        }
      }
    }

    function toggleSeguirRuta(){
      if(estado === "esperando" || estado === "moviendo"){
        seguirRuta = !seguirRuta;
        if(seguirRuta) {
          estado = "moviendo";
          rutaIndice = 0;
        } else if(!avanzar && !rotar){
          estado = "esperando";
        }
      }
    }

    window.addEventListener("keydown", e => {
      switch(e.key.toLowerCase()){
        case "w": keys.w = true; break;
        case "a": keys.a = true; break;
        case "s": keys.s = true; break;
        case "d": keys.d = true; break;
        case "q": keys.q = true; break;
        case "e": keys.e = true; break;
        case "z": keys.z = true; break;
        case "x": keys.x = true; break;
      }
    });

    window.addEventListener("keyup", e => {
      switch(e.key.toLowerCase()){
        case "w": keys.w = false; break;
        case "a": keys.a = false; break;
        case "s": keys.s = false; break;
        case "d": keys.d = false; break;
        case "q": keys.q = false; break;
        case "e": keys.e = false; break;
        case "z": keys.z = false; break;
        case "x": keys.x = false; break;
      }
    });

    // Agregar manejador para cuando la ventana pierde el foco
    window.addEventListener("blur", () => {
      // Resetear todas las teclas cuando la ventana pierde el foco
      Object.keys(keys).forEach(key => keys[key] = false);
      isPaused = true;
      if (inactivityTimeout) {
        clearTimeout(inactivityTimeout);
      }
    });

    window.addEventListener("focus", () => {
      isPaused = false;
      resetInactivityTimer();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        isPaused = true;
        // Reset movement states
        avanzar = false;
        rotar = false;
        seguirRuta = false;
        // Reset all keys
        Object.keys(keys).forEach(key => keys[key] = false);
        if (inactivityTimeout) {
          clearTimeout(inactivityTimeout);
        }
      } else {
        isPaused = false;
        resetInactivityTimer();
      }
    });

    let lastActivityTime = Date.now();
    let inactivityTimeout = null;
    
    function resetInactivityTimer() {
      lastActivityTime = Date.now();
      if (isPaused && !document.hidden) {
        isPaused = false;
        document.getElementById('estadoPausa').style.display = 'none';
      }
      if (inactivityTimeout) {
        clearTimeout(inactivityTimeout);
      }
      startInactivityTimer();
    }

    function startInactivityTimer() {
      const tiempoInactividad = parseInt(document.getElementById('tiempoInactividad').value) * 1000;
      inactivityTimeout = setTimeout(() => {
        if (!document.hidden) {  // Solo pausar si la página está visible
          isPaused = true;
          document.getElementById('estadoPausa').style.display = 'block';
        }
      }, tiempoInactividad);
    }

    // Agregar event listeners para detectar actividad
    window.addEventListener('mousemove', resetInactivityTimer);
    window.addEventListener('keydown', resetInactivityTimer);
    window.addEventListener('click', resetInactivityTimer);
    window.addEventListener('scroll', resetInactivityTimer);

    // Actualizar tiempo de inactividad cuando cambie el selector
    document.getElementById('tiempoInactividad').addEventListener('change', () => {
      const tiempoSeleccionado = document.getElementById('tiempoInactividad').value;
      document.getElementById('tiempoInactividadValor').textContent = tiempoSeleccionado;
      resetInactivityTimer();
    });

    // Iniciar el timer de inactividad
    startInactivityTimer();

    function moverPorTeclado(delta, velAvance, velRotacion){
      if(keys.q) grupo.rotation.y += velRotacion * delta;
      if(keys.e) grupo.rotation.y -= velRotacion * delta;

      const dir = new THREE.Vector3();
      if(keys.w) dir.z -= 1;
      if(keys.s) dir.z += 1;
      if(keys.a) dir.x -= 1;
      if(keys.d) dir.x += 1;

      if(dir.lengthSq() > 0){
        dir.normalize();
        dir.applyEuler(grupo.rotation);
        grupo.position.addScaledVector(dir, velAvance * delta);
      }

      if(keys.z){
        altitudObjetivo += 5 * delta;
        if(altitudObjetivo > 30) altitudObjetivo = 30;
        actualizarAltitudObjetivo();
      }
      if(keys.x){
        altitudObjetivo -= 5 * delta;
        if(altitudObjetivo < 1) altitudObjetivo = 1;
        actualizarAltitudObjetivo();
      }
    }

    function actualizarAltitudObjetivo(){
      document.getElementById("altitudValor").textContent = altitudObjetivo.toFixed(1);
      drones.forEach(d => {
        d.target.y = altitudObjetivo;
      });
    }

    function seguirWaypoints(velAvance, velRotacion, delta){
      if(waypoints.length === 0) return;
      const objetivo = waypoints[rutaIndice];
      const posActual = grupo.position.clone();
      posActual.y = 0;
      const objetivoPlano = objetivo.clone();
      objetivoPlano.y = 0;

      const dir = new THREE.Vector3().subVectors(objetivoPlano, posActual);
      const distancia = dir.length();
      if(distancia < 0.5){
        rutaIndice = (rutaIndice + 1) % waypoints.length;
      } else {
        dir.normalize();

        let angActual = grupo.rotation.y % (Math.PI*2);
        if(angActual < 0) angActual += Math.PI*2;
        let angDeseado = Math.atan2(dir.x, dir.z);
        if(angDeseado < 0) angDeseado += Math.PI*2;

        let diff = angDeseado - angActual;
        if(diff > Math.PI) diff -= Math.PI*2;
        if(diff < -Math.PI) diff += Math.PI*2;

        if(Math.abs(diff) > 0.02){
          grupo.rotation.y += Math.sign(diff)*velRotacion*delta;
        } else {
          grupo.rotation.y = angDeseado;
          grupo.position.addScaledVector(dir, velAvance*delta);
        }
      }
    }

    function updateDronePhysics(drone, delta, time) {
      const inercia = parseFloat(document.getElementById("inerciaDrones").value);
      
      // Calcular la posición objetivo en el espacio mundial
      const targetWorld = drone.target.clone().applyMatrix4(grupo.matrixWorld);
      const currentWorld = drone.mesh.getWorldPosition(new THREE.Vector3());
      
      // Convertir de vuelta al espacio local del grupo
      const targetLocal = targetWorld.clone().applyMatrix4(grupo.matrixWorld.clone().invert());
      
      // Calcular la fuerza hacia el objetivo
      const force = new THREE.Vector3().subVectors(targetLocal, drone.mesh.position);
      const distance = force.length();
      
      if(distance > 0.1) {
        // Normalizar y aplicar aceleración proporcional a la distancia
        force.normalize();
        const accelerationMagnitude = Math.min(distance * 2, drone.maxAcceleration);
        force.multiplyScalar(accelerationMagnitude);
        
        // Aplicar la fuerza a la aceleración
        drone.acceleration.copy(force);
      } else {
        // Si está cerca del objetivo, reducir aceleración
        drone.acceleration.multiplyScalar(0.1);
      }
      
      // Integrar física
      drone.velocity.addScaledVector(drone.acceleration, delta);
      
      // Limitar velocidad máxima
      if(drone.velocity.length() > drone.maxSpeed) {
        drone.velocity.normalize().multiplyScalar(drone.maxSpeed);
      }
      
      // Aplicar amortiguación (resistencia del aire)
      drone.velocity.multiplyScalar(drone.dampening);
      
      // Actualizar posición
      drone.mesh.position.addScaledVector(drone.velocity, delta);
      
      // Efecto de hovering sutil
      const hoverOffset = Math.sin(time * drone.hover.frequency + drone.hover.offset) * drone.hover.amplitude;
      drone.mesh.position.y += hoverOffset * delta;
      
      // Rotación sutil basada en velocidad
      if(drone.velocity.length() > 0.1) {
        const targetRotation = Math.atan2(drone.velocity.x, drone.velocity.z);
        drone.mesh.rotation.y += (targetRotation - drone.mesh.rotation.y) * 0.05;
        
        // Inclinación basada en aceleración lateral
        const tiltAmount = drone.acceleration.x * 0.1;
        drone.mesh.rotation.z += (tiltAmount - drone.mesh.rotation.z) * 0.1;
      }
    }

    let lastTime = 0;
    function animate(time = 0) {
      if (!isPaused) {
        requestAnimationFrame(animate);
        const currentTime = time * 0.001;
        const delta = currentTime - lastTime || 0.016;
        lastTime = currentTime;

        if(estado === "despegando"){
          let allAlcanzaron = true;
          drones.forEach(d => {
            if(d.despegando) {
              const targetY = d.target.y;
              const currentY = d.mesh.position.y;
              
              if(currentY < targetY) {
                // Despegue gradual con aceleración
                const despegueSpeed = 3 + Math.sin(currentTime * 2) * 0.5;
                d.mesh.position.y += despegueSpeed * delta;
                allAlcanzaron = false;
              } else {
                d.mesh.position.y = targetY;
              }
            } else {
              allAlcanzaron = false;
            }
          });
          if(allAlcanzaron) estado = "esperando";
        } else if(estado === "esperando" || estado === "moviendo"){
          // Actualizar física de cada dron
          drones.forEach(d => {
            updateDronePhysics(d, delta, currentTime);
          });

          if(seguirRuta){
            const velAvance = parseFloat(document.getElementById("velAvance").value) * 10;
            const velRotacion = parseFloat(document.getElementById("velRotacion").value) * 10;
            seguirWaypoints(velAvance, velRotacion, delta);
          }
          if(avanzar && !seguirRuta){
            const velAvance = parseFloat(document.getElementById("velAvance").value) * 10;
            const dir = new THREE.Vector3(0,0,-1).applyEuler(grupo.rotation);
            grupo.position.addScaledVector(dir, velAvance*delta);
          }
          if(rotar && !seguirRuta){
            const velRotacion = parseFloat(document.getElementById("velRotacion").value);
            grupo.rotation.y += velRotacion*delta*10;
          }
          moverPorTeclado(delta, parseFloat(document.getElementById("velAvance").value)*10, parseFloat(document.getElementById("velRotacion").value)*10);
        }

        renderer.render(scene, camera);
      } else {
        requestAnimationFrame(animate);
      }
    }

    // Sincronizar slider y input numérico
    const sliderCantidad = document.getElementById("cantidadDrones");
    const inputCantidad = document.getElementById("cantidadDronesInput");
    const cantidadValor = document.getElementById("cantidadValor");

    function actualizarCantidad(valor){
      let val = parseInt(valor);
      if(isNaN(val) || val < 1) val = 1;
      else if(val > 100) val = 100;
      sliderCantidad.value = val;
      inputCantidad.value = val;
      cantidadValor.textContent = val;
      totalDrones = val;
    }

    sliderCantidad.addEventListener("input", e => {
      actualizarCantidad(e.target.value);
    });

    inputCantidad.addEventListener("input", e => {
      actualizarCantidad(e.target.value);
    });

    // Crear formación inicial
    crearFormacion();

    // Agregar listener para el slider de grupos
    const sliderGrupos = document.getElementById("cantidadGrupos");
    const gruposValor = document.getElementById("gruposValor");
    
    sliderGrupos.addEventListener("input", e => {
      gruposValor.textContent = e.target.value;
    });

    animate();
  </script>
</body>
